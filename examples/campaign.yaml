name: Monte Carlo parameter study
description: Compare sample budgets and repeat each seeded case.
template:
  name: Estimate pi
  image: strata/python-workloads:local
  command: [python, /app/main.py, monte-carlo, --samples, '${samples}', --seed, '${seed}']
  resources: {cpu: 0.5, memory_mb: 128}
  timeout_seconds: 600
  max_retries: 3
matrix:
  samples: [10000, 100000, 1000000]
  seed: [1, 2, 3, 4]
repeats: 2
