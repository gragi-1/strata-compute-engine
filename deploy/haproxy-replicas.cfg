global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 2s
    retries 0

resolvers docker
    nameserver local 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend workspace
    bind :8080
    mode http
    default_backend workspace_replicas

backend workspace_replicas
    mode http
    option http-server-close
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host strata
    http-check expect status 200
    server node-a node-a:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
    server node-b node-b:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none

frontend worker_control
    bind :50051
    mode tcp
    option tcplog
    default_backend worker_replicas

backend worker_replicas
    mode tcp
    balance first
    # TLS passes through to the selected RPC replica. Health comes from its supervised API.
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host strata
    http-check expect status 200
    server node-a node-a:50051 check port 8000 inter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server node-b node-b:50051 check port 8000 inter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
