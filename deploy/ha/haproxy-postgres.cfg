global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout check 2s
    retries 0

resolvers docker
    nameserver local 127.0.0.11:53
    hold valid 5s
    timeout resolve 1s
    timeout retry 1s

frontend postgres_writer
    bind :5432
    default_backend current_primary

backend current_primary
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host strata
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    # Database TLS passes through; only the mTLS health probe uses these credentials.
    server pg-a pg-a:5432 check port 8008 check-ssl verify required ca-file /run/strata/tls/ca.pem crt /run/strata/tls/health.pem verifyhost pg-a resolvers docker init-addr libc,none
    server pg-b pg-b:5432 check port 8008 check-ssl verify required ca-file /run/strata/tls/ca.pem crt /run/strata/tls/health.pem verifyhost pg-b resolvers docker init-addr libc,none
    server pg-c pg-c:5432 check port 8008 check-ssl verify required ca-file /run/strata/tls/ca.pem crt /run/strata/tls/health.pem verifyhost pg-c resolvers docker init-addr libc,none
